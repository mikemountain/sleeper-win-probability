# Win probability page at https://<your site>/winprob/
# Include this inside your site's existing `server { ... }` block:
#     include snippets/winprob.conf;

location = /winprob {
    return 301 /winprob/;
}

location /winprob/ {
    # The trailing slash strips /winprob/ before passing the request on.
    proxy_pass http://127.0.0.1:3017/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
